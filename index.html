<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>내 블로그</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;
      --bg:#F5F7FA;--surface:#FFFFFF;--ink:#1B2433;--muted:#5A6678;--line:#DCE2EA;
      --accent:#0F6E73;--accent-soft:#E3F2F2;
      --sans:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
      --mono:"IBM Plex Mono","D2Coding","SFMono-Regular",Consolas,"Liberation Mono",monospace}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
    a{color:var(--accent)}
    header.hero{max-width:860px;margin:0 auto;padding:56px 28px 28px}
    header.hero h1{font-size:clamp(28px,4.4vw,46px);line-height:1.15;margin:0 0 14px;letter-spacing:-.02em;font-weight:700}
    header.hero p{margin:0;max-width:62ch;color:var(--muted);font-size:17px}
    main{max-width:860px;margin:0 auto;padding:12px 28px 80px}
    .step{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px 28px 14px;margin:0 0 22px}
    .step .badge{position:absolute;top:-1px;left:-1px;background:var(--accent);color:#fff;font-family:var(--mono);font-weight:600;font-size:14px;min-width:34px;height:34px;display:grid;place-items:center;border-radius:10px 0 10px 0}
    .step h2{margin:6px 0 12px 30px;font-size:21px;letter-spacing:-.01em}
    ul.posts{list-style:none;margin:0;padding:0}
    ul.posts li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
    ul.posts li:first-child{border-top:0}
    ul.posts a{color:var(--ink);text-decoration:none;font-weight:500}
    ul.posts a:hover{color:var(--accent);text-decoration:underline}
    ul.posts a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    ul.posts span{flex:none;font-family:var(--mono);font-size:13px;color:var(--muted);background:var(--accent-soft);padding:2px 9px;border-radius:999px}
    @media (max-width:640px){
      header.hero{padding:36px 16px 16px}
      main{padding:8px 16px 60px}
      .step{padding:22px 16px 10px}
      ul.posts li{flex-direction:column;align-items:flex-start;gap:4px}
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>블로그 게시글 목록</h1>
    <p>지금까지 작성한 글을 최신순으로 모아 두었습니다.</p>
  </header>

  <main>
    <section class="step">
      <span class="badge" aria-hidden="true">{{ site.posts | size }}</span>
      <h2>전체 게시글</h2>
      <ul class="posts">
        {% for post in site.posts %}
          <li>
            <!-- 수정된 부분: | relative_url 추가 -->
            <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
            <span>{{ post.date | date: "%Y-%m-%d" }}</span>
          </li>
        {% endfor %}
      </ul>
    </section>
  </main>
</body>
</html>
