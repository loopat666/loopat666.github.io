<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>내 블로그</title>
</head>
<body>
  <h1>블로그 게시글 목록</h1>
  <ul>
    {% for post in site.posts %}
      <li>
        <a href="{{ post.url }}">{{ post.title }}</a>
        <span>{{ post.date | date: "%Y-%m-%d" }}</span>
      </li>
    {% endfor %}
  </ul>
</body>
</html>
